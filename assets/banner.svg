<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="40%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>

    <!-- Neon glow filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2744" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00fff5" stroke-width="0.15" opacity="0.08"/>
    </pattern>

    <!-- Animated gradient for border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00fff5">
        <animate attributeName="stop-color" values="#00fff5;#ff00ff;#0066ff;#39ff14;#00fff5" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff00ff">
        <animate attributeName="stop-color" values="#ff00ff;#0066ff;#39ff14;#00fff5;#ff00ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0066ff">
        <animate attributeName="stop-color" values="#0066ff;#39ff14;#00fff5;#ff00ff;#0066ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fff5"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Clip for typing animation -->
    <clipPath id="typeClip">
      <rect x="0" y="0" width="900" height="400">
        <animate attributeName="width" from="0" to="900" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>

    <style>
      @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes slideIn { 0%{opacity:0;transform:translateX(-30px)} 100%{opacity:1;transform:translateX(0)} }
      @keyframes dashMove { to{stroke-dashoffset:0} }
      @keyframes fadeIn { 0%{opacity:0} 100%{opacity:1} }
      @keyframes glitch1 { 0%,100%{transform:translate(0)} 20%{transform:translate(-2px,1px)} 40%{transform:translate(2px,-1px)} 60%{transform:translate(-1px,2px)} 80%{transform:translate(1px,-2px)} }
      @keyframes orbit { 0%{transform:rotate(0deg) translateX(12px) rotate(0deg)} 100%{transform:rotate(360deg) translateX(12px) rotate(-360deg)} }
      @keyframes scan { 0%{transform:translateY(-400px)} 100%{transform:translateY(400px)} }

      .title { font-family: 'Segoe UI', 'Courier New', monospace; font-size: 42px; font-weight: 900; fill: url(#titleGrad); letter-spacing: 3px; }
      .subtitle { font-family: 'Courier New', monospace; font-size: 16px; fill: #8b949e; }
      .label { font-family: 'Courier New', monospace; font-size: 13px; fill: #ff00ff; font-weight: bold; }
      .value { font-family: 'Courier New', monospace; font-size: 13px; fill: #c9d1d9; }
      .accent { fill: #00fff5; }
      .prompt { font-family: 'Courier New', monospace; font-size: 14px; fill: #39ff14; font-weight: bold; }
      .cmd { font-family: 'Courier New', monospace; font-size: 14px; fill: #c9d1d9; }
      .cursor { animation: blink 1s steps(1) infinite; }
      .dot-pulse { animation: pulse 2s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      .node { fill: none; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="900" height="400" fill="url(#bg)" rx="12"/>
  <rect width="900" height="400" fill="url(#grid)" rx="12"/>
  <rect width="900" height="400" fill="url(#scanlines)" rx="12" opacity="0.5"/>

  <!-- Animated border -->
  <rect x="2" y="2" width="896" height="396" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.8"/>

  <!-- Scan line effect -->
  <rect x="0" y="0" width="900" height="3" fill="#00fff5" opacity="0.04" rx="0">
    <animateTransform attributeName="transform" type="translate" values="0,-10;0,410" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- === DECORATIVE CIRCUIT LINES (left side) === -->
  <g opacity="0.25">
    <!-- Vertical line -->
    <line x1="45" y1="30" x2="45" y2="370" stroke="#00fff5" stroke-width="0.8" stroke-dasharray="200 600" stroke-dashoffset="800">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="4s" repeatCount="indefinite"/>
    </line>
    <!-- Horizontal branches -->
    <line x1="45" y1="80" x2="80" y2="80" stroke="#00fff5" stroke-width="0.8"/>
    <circle cx="80" cy="80" r="2.5" fill="#00fff5" class="dot-pulse"/>
    <line x1="45" y1="160" x2="75" y2="160" stroke="#ff00ff" stroke-width="0.8"/>
    <circle cx="75" cy="160" r="2.5" fill="#ff00ff" class="dot-pulse" style="animation-delay:0.5s"/>
    <line x1="45" y1="240" x2="70" y2="240" stroke="#0066ff" stroke-width="0.8"/>
    <circle cx="70" cy="240" r="2.5" fill="#0066ff" class="dot-pulse" style="animation-delay:1s"/>
    <line x1="45" y1="320" x2="85" y2="320" stroke="#39ff14" stroke-width="0.8"/>
    <circle cx="85" cy="320" r="2.5" fill="#39ff14" class="dot-pulse" style="animation-delay:1.5s"/>
  </g>

  <!-- === DECORATIVE CIRCUIT LINES (right side) === -->
  <g opacity="0.25">
    <line x1="855" y1="30" x2="855" y2="370" stroke="#ff00ff" stroke-width="0.8" stroke-dasharray="150 650" stroke-dashoffset="800">
      <animate attributeName="stroke-dashoffset" from="800" to="0" dur="5s" repeatCount="indefinite"/>
    </line>
    <line x1="855" y1="100" x2="825" y2="100" stroke="#ff00ff" stroke-width="0.8"/>
    <circle cx="825" cy="100" r="2.5" fill="#ff00ff" class="dot-pulse" style="animation-delay:0.3s"/>
    <line x1="855" y1="200" x2="830" y2="200" stroke="#00fff5" stroke-width="0.8"/>
    <circle cx="830" cy="200" r="2.5" fill="#00fff5" class="dot-pulse" style="animation-delay:0.8s"/>
    <line x1="855" y1="300" x2="820" y2="300" stroke="#0066ff" stroke-width="0.8"/>
    <circle cx="820" cy="300" r="2.5" fill="#0066ff" class="dot-pulse" style="animation-delay:1.3s"/>
  </g>

  <!-- === CORNER DECORATIONS === -->
  <!-- Top-left corner -->
  <path d="M12,40 L12,14 L40,14" fill="none" stroke="#00fff5" stroke-width="1.5" filter="url(#glowCyan)" opacity="0.7"/>
  <!-- Top-right corner -->
  <path d="M860,14 L888,14 L888,40" fill="none" stroke="#ff00ff" stroke-width="1.5" filter="url(#glowMagenta)" opacity="0.7"/>
  <!-- Bottom-left corner -->
  <path d="M12,360 L12,386 L40,386" fill="none" stroke="#ff00ff" stroke-width="1.5" filter="url(#glowMagenta)" opacity="0.7"/>
  <!-- Bottom-right corner -->
  <path d="M860,386 L888,386 L888,360" fill="none" stroke="#00fff5" stroke-width="1.5" filter="url(#glowCyan)" opacity="0.7"/>

  <!-- === FLOATING PARTICLES === -->
  <g opacity="0.5">
    <circle cx="120" cy="50" r="1.2" fill="#00fff5" class="float"/>
    <circle cx="300" cy="370" r="1" fill="#ff00ff" class="float" style="animation-delay:0.5s"/>
    <circle cx="500" cy="30" r="1.5" fill="#0066ff" class="float" style="animation-delay:1s"/>
    <circle cx="700" cy="380" r="1" fill="#39ff14" class="float" style="animation-delay:1.5s"/>
    <circle cx="780" cy="60" r="1.2" fill="#00fff5" class="float" style="animation-delay:2s"/>
    <circle cx="200" cy="350" r="0.8" fill="#ff00ff" class="float" style="animation-delay:0.8s"/>
    <circle cx="650" cy="45" r="1" fill="#0066ff" class="float" style="animation-delay:1.2s"/>
    <circle cx="400" cy="375" r="1.3" fill="#00fff5" class="float" style="animation-delay:0.3s"/>
  </g>

  <!-- === HEX DECORATION (top-right area) === -->
  <g transform="translate(790, 55)" opacity="0.15">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="none" stroke="#00fff5" stroke-width="1" class="float" style="animation-delay:0.5s"/>
    <polygon points="0,-10 8.7,-5 8.7,5 0,10 -8.7,5 -8.7,-5" fill="none" stroke="#ff00ff" stroke-width="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- === MAIN CONTENT === -->

  <!-- Terminal window header bar -->
  <rect x="80" y="35" width="740" height="28" rx="6" fill="#161b22" opacity="0.9"/>
  <circle cx="100" cy="49" r="5" fill="#ff5f57"/>
  <circle cx="118" cy="49" r="5" fill="#febc2e"/>
  <circle cx="136" cy="49" r="5" fill="#28c840"/>
  <text x="450" y="53" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#484f58">afergit@universe: ~/portfolio</text>

  <!-- GLITCH NAME -->
  <g filter="url(#glowCyan)">
    <text x="450" y="115" text-anchor="middle" class="title">AFER</text>
  </g>
  <!-- Glitch layers -->
  <text x="452" y="117" text-anchor="middle" class="title" opacity="0.15" fill="#ff00ff" style="animation:glitch1 3s infinite">AFER</text>
  <text x="448" y="113" text-anchor="middle" class="title" opacity="0.1" fill="#00fff5" style="animation:glitch1 2.5s infinite reverse">AFER</text>

  <!-- Role subtitle with typing effect -->
  <text x="450" y="145" text-anchor="middle" class="subtitle" opacity="0" style="animation:fadeIn 0.5s 0.5s forwards">
    <tspan fill="#00fff5">&#60;</tspan> Software Engineer <tspan fill="#ff00ff">/</tspan> Cybersecurity Specialist <tspan fill="#00fff5">&#62;</tspan>
  </text>

  <!-- Separator line -->
  <line x1="180" y1="170" x2="720" y2="170" stroke="url(#borderGrad)" stroke-width="0.8" opacity="0.5"/>

  <!-- === TERMINAL COMMAND SECTION === -->
  <g opacity="0" style="animation:fadeIn 0.5s 1s forwards">
    <!-- Command 1 -->
    <text x="110" y="210" class="prompt">$</text>
    <text x="130" y="210" class="cmd">cat <tspan class="accent">skills.json</tspan></text>

    <!-- Skills display -->
    <text x="130" y="235" class="label">languages<tspan class="value">: [ Python, JavaScript, TypeScript, Java, Go, SQL ]</tspan></text>
    <text x="130" y="255" class="label">frameworks<tspan class="value">: [ React, Node.js, Django, Spring Boot, Express ]</tspan></text>
    <text x="130" y="275" class="label">security<tspan class="value">: [ Burp Suite, Nmap, Metasploit, OWASP, Wireshark ]</tspan></text>
    <text x="130" y="295" class="label">devops<tspan class="value">: [ Docker, Kubernetes, AWS, CI/CD, Linux ]</tspan></text>

    <!-- Command 2 -->
    <text x="110" y="330" class="prompt">$</text>
    <text x="130" y="330" class="cmd">echo <tspan fill="#39ff14">"Building secure systems, one commit at a time."</tspan></text>
  </g>

  <!-- Blinking cursor at bottom -->
  <g opacity="0" style="animation:fadeIn 0.5s 2s forwards">
    <text x="110" y="365" class="prompt">$</text>
    <rect x="128" y="353" width="8" height="15" fill="#39ff14" class="cursor"/>
  </g>

  <!-- === STATUS INDICATORS (right side) === -->
  <g transform="translate(720, 210)" opacity="0" style="animation:fadeIn 0.5s 1.5s forwards">
    <circle cx="0" cy="0" r="4" fill="#39ff14" class="dot-pulse"/>
    <text x="12" y="4" font-family="'Courier New', monospace" font-size="10" fill="#39ff14">ONLINE</text>

    <circle cx="0" cy="22" r="4" fill="#00fff5" class="dot-pulse" style="animation-delay:0.3s"/>
    <text x="12" y="26" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">OPEN TO WORK</text>

    <circle cx="0" cy="44" r="4" fill="#ff00ff" class="dot-pulse" style="animation-delay:0.6s"/>
    <text x="12" y="48" font-family="'Courier New', monospace" font-size="10" fill="#8b949e">BUILDING</text>
  </g>

  <!-- === BOTTOM BAR === -->
  <rect x="80" y="380" width="740" height="6" rx="3" fill="#161b22" opacity="0.6"/>
  <rect x="80" y="380" width="500" height="6" rx="3" fill="url(#borderGrad)" opacity="0.4">
    <animate attributeName="width" values="100;500;300;740;100" dur="6s" repeatCount="indefinite"/>
  </rect>

</svg>
